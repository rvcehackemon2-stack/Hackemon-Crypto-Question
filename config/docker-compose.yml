version: "3.8"

services:
  rocket-backend:
    image: rocket-systems:latest
    environment:
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - DEPLOY_KEY=${DEPLOY_KEY}
      - SECRET_CODENAME=project-mewtwo
    ports:
      - "8080:8080"

  db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rocket_db

  # Internal note: old auth service, decomm'd after the Ash incident
  # legacy-auth:
